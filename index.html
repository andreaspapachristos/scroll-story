<!DOCTYPE html>
<html lang="el">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <title>Scroll Story</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Anime.js -->
    <script
        src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js">
    </script>

</head>


<body>


    <!-- =================================
         MAIN STORY
    ================================== -->

    <main class="story">


        <!-- =================================
             LEFT — IMAGE
        ================================== -->

        <div class="visual-column">

            <div class="visual-frame">

                <div class="image-stack">


                    <img
                        src="images/andreas.jpg"
                        class="story-image active"
                        alt=""
                    >


                    <img
                        src="images/computer.jpg"
                        class="story-image"
                        alt=""
                    >


                    <img
                        src="images/swimming.jpg"
                        class="story-image"
                        alt=""
                    >


                    <img
                        src="images/dromos.jpg"
                        class="story-image"
                        alt=""
                    >


                </div>

            </div>

        </div>



        <!-- =================================
             RIGHT — TEXT
        ================================== -->

        <div class="content-column">


            <div class="story-content">


                <div class="section-number">
                    01
                </div>


                <h1 id="story-title">
                    I'm Andreas
                </h1>


                <p id="story-text">
                   " I'm Andreas." + 
                    " I like to create, learn, and grow, " +
                    "I believe that experience has value when it's combined with " + 
                    "curiosity and a willingness to try something new." 
                    </p>


            </div>

        </div>


    </main>



    <!-- =================================
         PROGRESS BAR
    ================================== -->

    <div class="progress">

        <div class="progress-bar"></div>

    </div>



    <!-- =================================
         DOT NAVIGATION
    ================================== -->

    <div class="dots">


        <button
            class="dot active"
            data-index="0">
        </button>


        <button
            class="dot"
            data-index="1">
        </button>


        <button
            class="dot"
            data-index="2">
        </button>


        <button
            class="dot"
            data-index="3">
        </button>


    </div>



    <script src="story.js"></script>


</body>

</html>
